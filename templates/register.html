<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YuuY Chat - Register</title>
    <link rel="icon" href="/static/favicon.ico">
    <link rel="stylesheet" href="/static/css/auth.css">
</head>
<body>
    <div class="auth-box">
        <h2 id="authTitle">YuuY Register</h2>
        <form id="authForm">
            <input type="text" id="username" placeholder="Username" required autocomplete="off">
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit" id="authBtn">Register</button>
        </form>
        <div class="switch" id="authSwitch">
            Have account? <a href="/login">Login</a>
        </div>
    </div>
    <script src="/static/js/auth.js"></script>
</body>
</html>
